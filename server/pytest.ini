[pytest]
# Collect ONLY the server's own suite.
#
# `python -m pytest` with no argument, run from this directory, otherwise walks
# everything under it: `tools/<name>/test/` (a packaged tool's own tests, which
# belong to that tool and must run in ITS interpreter, not the API's) and, on a
# developer machine, `venv/` -- which is tens of thousands of third-party test
# files and several minutes of collection before a single assertion runs.
#
# A tool's tests are not skipped here, they are somebody else's job: each tool
# ships its own pytest configuration and runs against its own pinned
# dependencies. Collecting them with the API's interpreter would import a tool
# the API deliberately cannot import.
testpaths = tests

# Real inference against whatever is staged under DATA/, opt-in via
# RUN_REAL_DATA_TESTS. Minutes on a GPU, hours on a CPU -- see
# tests/test_data_integration.py.
markers =
    real_data: needs the real model bundles. Skipped unless RUN_REAL_DATA_TESTS is set.
